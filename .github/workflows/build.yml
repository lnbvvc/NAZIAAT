name: Build Surah An-Naziat APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Verify Android SDK & Install Gradle 8.4
        run: |
          # التأكد من مسار Android SDK المثبت مسبقاً في السيرفر أو تحميله عند الحاجة
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdtools.zip
            unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

          # تحميل Gradle 8.4 مباشرة لتفادي مشاكل توافق الإضافات
          curl -sL https://services.gradle.org/distributions/gradle-8.4-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$HOME"

      - name: 4. Generate Android Project & Download Offline Audio
        run: |
          mkdir -p android-app/app/src/main/java/com/quran/nazi3at
          mkdir -p android-app/app/src/main/assets/audio

          # نسخ واجهة التطبيق
          cp index.html android-app/app/src/main/assets/index.html

          # تحميل الـ 46 آية صوتية (الحصري المعلم) ودمجها داخل الـ APK لتشتغل بدون أنترنيت
          echo "Downloading 46 audio files for offline use..."
          for i in $(seq -f "%03g" 1 46); do
            curl -s -L --retry 3 "https://everyayah.com/data/Husary_Muallim_128kbps/079${i}.mp3" \
              -o "android-app/app/src/main/assets/audio/079${i}.mp3"
          done

          cat << 'EOF' | sed 's/^          //' > android-app/settings.gradle
          rootProject.name = "SurahAnNaziat"
          include ':app'
          EOF

          cat << 'EOF' | sed 's/^          //' > android-app/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' | sed 's/^          //' > android-app/app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.quran.nazi3at'
              compileSdk 34

              defaultConfig {
                  applicationId "com.quran.nazi3at"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' | sed 's/^          //' > android-app/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="سورة النازعات"
                  android:icon="@android:drawable/ic_media_play"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' | sed 's/^          //' > android-app/app/src/main/java/com/quran/nazi3at/MainActivity.java
          package com.quran.nazi3at;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: 5. Build APK
        working-directory: ./android-app
        run: |
          "$HOME/gradle-8.4/bin/gradle" assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Surah-An-Naziat.apk

      - name: 6. Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Surah-An-Naziat-APK
          path: Surah-An-Naziat.apk
