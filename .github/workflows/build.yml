name: Build APK Fast

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android Project
        run: |
          mkdir -p android-app/app/src/main/java/com/quran/nazi3at
          mkdir -p android-app/app/src/main/assets

          cp index.html android-app/app/src/main/assets/index.html

          cat << 'EOF' > android-app/settings.gradle
          rootProject.name = "SurahAnNaziat"
          include ':app'
          EOF

          cat << 'EOF' > android-app/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat << 'EOF' > android-app/app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.quran.nazi3at'
              compileSdk 34
              defaultConfig {
                  applicationId "com.quran.nazi3at"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false }
              }
          }
          EOF

          cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="سورة النازعات"
                  android:icon="@android:drawable/ic_media_play"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android-app/app/src/main/java/com/quran/nazi3at/MainActivity.java
          package com.quran.nazi3at;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  setContentView(webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

      - name: Build APK
        working-directory: ./android-app
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Surah-An-Naziat.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Surah-An-Naziat-APK
          path: Surah-An-Naziat.apk
